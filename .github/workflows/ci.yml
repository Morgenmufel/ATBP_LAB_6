name: Full CI/CD Pipeline

on:
  push:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project
        run: mvn clean package -DskipTests


  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: mvn test -Dtest="*Test"


  api-bdd-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install netcat
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Build project (required for Spring Boot run)
        run: mvn clean package -DskipTests

      - name: Start Spring Boot
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            if curl -s http://localhost:8080/users > /dev/null 2>&1; then
              echo "✅ App started successfully"
              exit 0
            fi
            echo "⏳ Waiting for app to start... ($i/30)"
            sleep 2
          done
          echo "❌ App failed to start. Log:"
          cat app.log
          exit 1

      - name: Run API + BDD tests
        run: mvn test -Dtest="*ApiTest,*CucumberTestRunner"

      - name: Stop Spring Boot
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi


  ui-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install netcat
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Start backend
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          for i in {1..30}; do
            nc -z localhost 8080 && echo "Backend ready" && exit 0
            sleep 2
          done
          echo "Backend failed"
          cat backend.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test


  allure:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-bdd-tests, ui-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests for report generation
        run: mvn test

      - name: Generate Allure report
        run: mvn allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin


  docker:
    runs-on: ubuntu-latest
    needs: allure

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo .


  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run container
        run: docker run -d -p 8081:8080 ci-cd-demo


  notify:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-bdd-tests, ui-tests]
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          STATUS="SUCCESS"

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.api-bdd-tests.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ]; then
            STATUS="FAILED"
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="CI/CD result: $STATUS"