name: Full CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project
        run: mvn clean package -DskipTests

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: mvn test -Dtest="*Test"

  api-bdd-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start Spring Boot
        run: |
          mvn spring-boot:run &
          sleep 15

      - name: Run API + BDD tests
        run: mvn test -Dtest="*ApiTest,*CucumberTestRunner"

  ui-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Start backend
        run: |
          mvn spring-boot:run &
          sleep 15

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test playwright/

  allure:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-bdd-tests, ui-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Generate Allure report
        run: mvn allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

  docker:
    runs-on: ubuntu-latest
    needs: allure

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-demo .

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run container
        run: docker run -d -p 8080:8080 ci-cd-demo

  notify:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-bdd-tests, ui-tests]
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          STATUS="SUCCESS"
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.api-bdd-tests.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ]; then
            STATUS="FAILED"
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="CI/CD result: $STATUS"
Repository: ${{ github.repository }}
Branch: ${{ github.ref_name }}
Commit: ${{ github.sha }}
Author: ${{ github.actor }}"